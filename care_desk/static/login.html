<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Care Desk</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--ink:#191616;--panel:#211D1D;--coral:#FC4452;--line-2:rgba(255,255,255,.14);--t-hi:rgba(255,255,255,.95);--t-mid:rgba(255,255,255,.66);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ink);color:var(--t-hi);font:400 15px/1.5 'Archivo','Helvetica Neue',Arial,sans-serif}
main{width:min(400px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:28px}
/* Same brand block as the Redefine App's tool pages. */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{height:32px;width:auto;display:block;flex:none}
.brand .word{font:400 22px/1 'Anton',Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.brand .divider{width:1px;height:24px;background:var(--line-2)}
.brand .tool{font:600 12px 'Archivo',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--t-mid)}
h1{margin:0 0 4px;font:400 34px/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
p{margin:0 0 22px;color:var(--t-mid)}
.google{display:flex;justify-content:center;min-height:44px}
/* Google's iframe is light; matching it stops the browser painting a white box behind the button. */
.google iframe{color-scheme:light}
#err{min-height:22px;margin:16px 0 0;color:var(--coral);font-weight:600}
/* Email code sign-in, shown only when the server can send email. */
.or{display:flex;align-items:center;gap:12px;margin:20px 0 16px;font:600 11px 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--t-mid)}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line-2)}
form{display:grid;gap:10px;margin:0}
form[hidden]{display:none}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--ink);color:var(--t-hi);font:400 15px 'Archivo',sans-serif}
input::placeholder{color:rgba(255,255,255,.4)}
input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
input.code{font:600 22px 'Archivo',sans-serif;letter-spacing:.3em;text-align:center}
.go{height:46px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:700 15px 'Archivo',sans-serif;cursor:pointer}
.go:hover{background:rgba(255,255,255,.88)}
.go:disabled{opacity:.55;cursor:default}
.go:focus-visible,.links button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.sent{margin:0 0 2px;font-size:14px;color:var(--t-mid);overflow-wrap:anywhere}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.links button{border:0;background:none;padding:6px 0;font:600 13px 'Archivo',sans-serif;color:var(--t-mid);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.links button:hover{color:var(--t-hi)}
.note{margin:6px 0 0;font-size:12px;color:var(--t-mid)}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/static/favicon.svg" alt="Redefine" width="32" height="32">
    <span class="word">Redefine</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="tool">Care Desk</span>
  </div>
  <h1>Sign in</h1>
  <p id="lede">Use the Google account a Care Desk admin added to the team.</p>

  <!-- Google renders its own button here; the client ID is filled in by the server. -->
  <div id="g_id_onload" data-client_id="__GOOGLE_CLIENT_ID__" data-callback="onGoogleCredential"
       data-auto_prompt="false" data-ux_mode="popup"></div>
  <div class="google"><div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"
       data-text="signin_with" data-shape="pill" data-logo_alignment="left"></div></div>

  <div id="emailLogin" hidden>
    <div class="or">or</div>
    <form id="emailForm" novalidate>
      <input id="email" type="email" autocomplete="email" placeholder="Enter your email" aria-label="Email">
      <button class="go" type="submit">Continue with email</button>
    </form>
    <form id="codeForm" hidden novalidate>
      <p class="sent" id="sentTo"></p>
      <input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Sign-in code">
      <button class="go" type="submit">Sign in</button>
      <div class="links"><button type="button" id="resend">Send a new code</button><button type="button" id="change">Use a different email</button></div>
    </form>
  </div>

  <p id="err" role="alert"></p>
</main>
<script>
  // Google hands over a signed token; the server checks it and the team list.
  async function onGoogleCredential(response) {
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const res = await fetch('/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential, next: '/desk' }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { err.textContent = data.detail || 'Sign-in failed. Try again.'; return; }
      location.replace(data.next || '/desk');
    } catch {
      err.textContent = 'Could not reach the desk. Check your connection and try again.';
    }
  }

  // Email code sign-in: the server says whether it can send email.
  if ('__EMAIL_LOGIN__' === 'on') {
    const $ = (id) => document.getElementById(id);
    const emailForm = $('emailForm'), codeForm = $('codeForm'), err = $('err');
    $('emailLogin').hidden = false;
    $('lede').textContent = 'Sign in with Google or your email. Only people a Care Desk admin added to the team can sign in.';
    const call = async (path, body) => {
      const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || 'Something went wrong. Try again.');
      return data;
    };
    const busy = (form, on) => form.querySelectorAll('button').forEach(b => { b.disabled = on; });
    const sendCode = async () => {
      const email = $('email').value.trim();
      if (!email) { $('email').focus(); err.textContent = 'Enter your email first.'; return; }
      err.textContent = ''; busy(emailForm, true); busy(codeForm, true);
      try {
        await call('/auth/email/start', { email });
        $('sentTo').textContent = `If ${email} is on the team list, a 6-digit code is on its way. Enter it here.`;
        emailForm.hidden = true; codeForm.hidden = false; $('code').value = ''; $('code').focus();
      } catch (e) { err.textContent = e.message; }
      finally { busy(emailForm, false); busy(codeForm, false); }
    };
    emailForm.addEventListener('submit', (e) => { e.preventDefault(); sendCode(); });
    $('resend').addEventListener('click', sendCode);
    $('change').addEventListener('click', () => { err.textContent = ''; codeForm.hidden = true; emailForm.hidden = false; $('email').focus(); });
    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = $('code').value.replace(/\s/g, '');
      if (code.length !== 6) { $('code').focus(); err.textContent = 'Enter the 6-digit code from the email.'; return; }
      err.textContent = ''; busy(codeForm, true);
      try {
        const data = await call('/auth/email/verify', { email: $('email').value.trim(), code, next: '/desk' });
        location.replace(data.next || '/desk');
      } catch (e2) { err.textContent = e2.message; busy(codeForm, false); $('code').select(); }
    });
  }
</script>
</body>
</html>
