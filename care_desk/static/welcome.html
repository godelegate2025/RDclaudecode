<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your name · Care Desk</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
:root{--ink:#191616;--panel:#211D1D;--coral:#FC4452;--line-2:rgba(255,255,255,.14);--t-hi:rgba(255,255,255,.95);--t-mid:rgba(255,255,255,.66);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ink);color:var(--t-hi);font:400 15px/1.5 'Archivo','Helvetica Neue',Arial,sans-serif}
main{width:min(400px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img{height:32px;width:auto;display:block;flex:none}
.brand .word{font:400 22px/1 'Anton',Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.brand .divider{width:1px;height:24px;background:var(--line-2)}
.brand .tool{font:600 12px 'Archivo',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--t-mid)}
h1{margin:0 0 4px;font:400 34px/1 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
p{margin:0 0 22px;color:var(--t-mid)}
form{display:grid;gap:10px;margin:0}
label{font:700 13px 'Archivo',sans-serif}
input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--ink);color:var(--t-hi);font:400 15px 'Archivo',sans-serif}
input::placeholder{color:rgba(255,255,255,.4)}
input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
.go{height:46px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:700 15px 'Archivo',sans-serif;cursor:pointer}
.go:hover{background:rgba(255,255,255,.88)}
.go:disabled{opacity:.55;cursor:default}
.go:focus-visible,.back:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.back{justify-self:center;padding:6px 0;font:600 13px 'Archivo',sans-serif;color:var(--t-mid)}
.back[hidden]{display:none}
#err{min-height:20px;margin:4px 0 0;color:var(--coral);font-weight:600}
.note{margin:12px 0 0;font-size:12px;color:var(--t-mid);overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/static/favicon.svg" alt="Redefine" width="32" height="32">
    <span class="word">Redefine</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="tool">Care Desk</span>
  </div>
  <h1 id="title">What's your name?</h1>
  <p id="lede">Your teammates see it on tickets, notes and the team list instead of your email. You can change it any time.</p>
  <form id="form" novalidate>
    <label for="name">Your name</label>
    <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="e.g. Maria Santos" value="__NAME__">
    <button class="go" type="submit" id="save">Continue</button>
    <a class="back" id="back" href="/desk" hidden>Cancel</a>
    <p id="err" role="alert"></p>
  </form>
  <p class="note">Signed in as __EMAIL__</p>
</main>
<script>
  const editing = '__EDIT__' === 'on';
  const $ = (id) => document.getElementById(id);
  if (editing) {
    $('title').textContent = 'Your name';
    $('lede').textContent = 'This is what your teammates see on tickets, notes and the team list instead of your email.';
    $('save').textContent = 'Save';
    $('back').hidden = false;
  }
  $('name').focus();
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name) { $('err').textContent = 'Enter your name.'; $('name').focus(); return; }
    $('err').textContent = ''; $('save').disabled = true;
    try {
      const res = await fetch('/auth/name', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'desk' }, body: JSON.stringify({ name }) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = '/login'; return; }
      if (!res.ok) throw new Error(data.detail || 'Could not save your name. Try again.');
      location.replace('/desk');
    } catch (err) { $('err').textContent = err.message; $('save').disabled = false; }
  });
</script>
</body>
</html>
