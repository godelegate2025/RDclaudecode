<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit history · Redefine App</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #FC4452; --coral-dark: #d92f3c; --ink: #191616; --charcoal: #2C2828;
  --paper: #F4F3F0; --paper-2: #EAE8E3; --line: #D8D5CE; --muted: #7C7773;
  --good: #0f8a3d; --warn: #b57500; --bad: #C3281C;
  --font-display: 'Anton', 'Arial Narrow', sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --radius: 10px; --header-h: 60px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body);
       font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 3px; }

header { height: var(--header-h); display: flex; align-items: center; gap: 16px; padding: 0 24px;
         border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.brand img { height: 32px; width: auto; display: block; }
.brand .word { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand .divider { width: 1px; height: 24px; background: var(--line); }
.brand .tool { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
header .spacer { flex: 1; }
header .account { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
header .account a { color: var(--ink); font-weight: 600; }

main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 4vw, 44px); line-height: 1;
     text-transform: uppercase; margin: 0 0 8px; }
h1 .accent { color: var(--coral); }
.lede { margin: 0 0 28px; color: var(--charcoal); max-width: 60ch; }

.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; text-transform: uppercase;
           letter-spacing: .02em; margin: 0 0 12px; }

.filters { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; align-items: center; margin-bottom: 18px; }
input, select {
  font: inherit; font-size: 15px; padding: 11px 13px; color: var(--ink); background: #fff;
  border: 1.5px solid var(--line); border-radius: var(--radius); min-width: 0;
}
input:focus, select:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(252, 68, 82, .14); }
label.mine { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
label.mine input { width: 18px; height: 18px; accent-color: var(--coral); }
.count { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }

.banner { display: none; border: 1.5px solid var(--warn); border-left-width: 4px; background: #FFF8EC;
          border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; font-size: 14px; }
.banner[data-show] { display: block; }
.banner strong { display: block; color: var(--warn); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.msg { display: none; margin-bottom: 14px; padding: 10px 13px; border-radius: 8px; font-size: 13.5px; }
.msg[data-show] { display: block; }
.msg.ok { background: #EAF5EE; color: var(--good); }
.msg.err { background: #FCF0EF; color: var(--bad); }

.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; background: #fff;
        border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 12px 12px;
        color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
.item:hover { border-color: var(--coral); box-shadow: 0 4px 16px rgba(25, 22, 22, .06); }
.thumb { width: 64px; height: 80px; border-radius: 6px; background: var(--paper-2) center / cover no-repeat;
         display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--muted); }
.who { min-width: 0; }
.who .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who .name { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.who .verdict { color: var(--charcoal); font-size: 13.5px; margin: 3px 0 4px; display: -webkit-box;
                -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.who .meta { color: var(--muted); font-size: 12.5px; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
        padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--charcoal); }
.stats { display: flex; gap: 18px; text-align: right; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.stat span { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat.hook b { color: var(--coral); }
.side { display: flex; align-items: center; gap: 14px; }
button.ghost { font: inherit; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
               background: transparent; color: var(--bad); border: 1.5px solid var(--line); border-radius: var(--radius);
               min-height: 34px; padding: 0 12px; font-size: 11px; }
button.ghost:hover:not(:disabled) { background: #FCF0EF; border-color: var(--bad); }
button.ghost:disabled { opacity: .5; }
.empty { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; background: #fff;
         border: 1px dashed var(--line); border-radius: var(--radius); }
.empty a { color: var(--ink); font-weight: 600; }

@media (max-width: 760px) {
  header { padding: 0 16px; }
  .brand .tool, header .account #accountEmail, header .account .sep { display: none; }
  main { padding: 28px 16px 64px; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters input[type=search] { grid-column: 1 / -1; }
  .item { grid-template-columns: 52px 1fr; }
  .thumb { width: 52px; height: 66px; }
  .side { grid-column: 1 / -1; justify-content: space-between; }
  .stats { text-align: left; }
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" title="Back to Redefine App">
    <img src="/static/logo.svg" alt="Redefine" width="29" height="32">
    <span class="word">Redefine</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="tool">History</span>
  </a>
  <div class="spacer"></div>
  <div class="account" id="account" hidden><span id="accountEmail"></span><span class="sep"> · </span><a href="/auth/logout">Sign out</a></div>
</header>

<main>
  <h1>Audit <span class="accent">history</span></h1>
  <p class="lede">Every post the team has audited, newest first. Open one to see the full report again
    or download its PDF.</p>

  <div class="banner" id="banner" role="status"><strong>History storage not set up</strong><span id="bannerText"></span></div>
  <div class="msg" id="msg" role="status"></div>

  <div class="filters">
    <input id="search" type="search" placeholder="Search account, link or verdict" aria-label="Search audits">
    <select id="platform" aria-label="Platform"><option value="">All platforms</option></select>
    <label class="mine" id="mineLabel" hidden><input id="mine" type="checkbox"> Only mine</label>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</main>

<script>
  // Everything shown comes from the server; it is only ever inserted as text.
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  };
  const msg = document.getElementById('msg');
  const say = (text, ok) => {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.setAttribute('data-show', '');
  };
  const fmtDate = (iso, withTime) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return withTime
      ? d.toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const compact = (n) => {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '–';
    return Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(Number(n));
  };
  const pct = (v) => (v === null || v === undefined || isNaN(v)) ? '–' : Number(v).toFixed(1).replace(/\.0$/, '') + '%';

  let me = '', canManage = false, audits = [];

  const stat = (cls, value, label) => {
    const s = el('div', 'stat ' + cls);
    s.append(el('b', null, value), el('span', null, label));
    return s;
  };

  const render = () => {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const platform = document.getElementById('platform').value;
    const mine = document.getElementById('mine').checked;
    const shown = audits.filter((a) =>
      (!platform || a.platform === platform) &&
      (!mine || (a.by || '').toLowerCase() === me.toLowerCase()) &&
      (!q || [a.author, a.handle, a.url, a.verdict, a.by, a.hook_type].join(' ').toLowerCase().includes(q)));
    document.getElementById('count').textContent = audits.length
      ? (shown.length === audits.length ? `${audits.length} audits` : `${shown.length} of ${audits.length} audits`) : '';
    const list = document.getElementById('list');
    list.textContent = '';
    if (!shown.length) {
      const empty = el('div', 'empty', audits.length ? 'No audits match.' : 'No audits saved yet. ');
      if (!audits.length) { const a = el('a', null, 'Audit a post'); a.href = '/post-audit'; empty.appendChild(a); }
      list.appendChild(empty);
      return;
    }
    for (const a of shown) {
      const item = el('a', 'item');
      item.href = '/post-audit?audit=' + encodeURIComponent(a.id);
      const thumb = el('div', 'thumb');
      if (typeof a.cover === 'string' && a.cover.startsWith('data:image/')) thumb.style.backgroundImage = `url("${a.cover}")`;
      else thumb.textContent = (a.platform_label || '?')[0];
      const who = el('div', 'who');
      const top = el('div', 'top');
      top.append(el('span', 'name', a.author || a.handle || 'Unknown account'), el('span', 'chip', a.platform_label || a.platform || ''));
      if (a.media_type) top.appendChild(el('span', 'chip', a.media_type));
      who.appendChild(top);
      if (a.verdict) who.appendChild(el('div', 'verdict', a.verdict));
      const meta = [a.handle && a.author ? '@' + a.handle.replace(/^@/, '') : '', a.posted_at && 'posted ' + fmtDate(a.posted_at),
                    'audited ' + fmtDate(a.created_at, true), a.by && 'by ' + a.by].filter(Boolean).join(' · ');
      who.appendChild(el('div', 'meta', meta));
      const side = el('div', 'side');
      const stats = el('div', 'stats');
      stats.append(stat('hook', a.hook_score ?? '–', 'Hook /10'), stat('', compact(a.views), 'Views'), stat('', pct(a.engagement), 'Eng.'));
      side.appendChild(stats);
      if (canManage || (me && (a.by || '').toLowerCase() === me.toLowerCase()) || !me) {
        const del = el('button', 'ghost', 'Delete');
        del.type = 'button';
        del.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); remove(a, del); });
        side.appendChild(del);
      }
      item.append(thumb, who, side);
      list.appendChild(item);
    }
  };

  const remove = async (a, button) => {
    if (!confirm(`Delete the audit of ${a.author || a.handle || 'this post'}? This cannot be undone.`)) return;
    button.disabled = true;
    try {
      const res = await fetch('/api/history/' + encodeURIComponent(a.id), { method: 'DELETE' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { say(data.detail || 'Could not delete it.', false); button.disabled = false; return; }
      audits = audits.filter((x) => x.id !== a.id);
      say('Audit deleted.', true);
      render();
    } catch (e) {
      say('Could not reach the server. Try again.', false);
      button.disabled = false;
    }
  };

  const load = async () => {
    try {
      const res = await fetch('/api/history', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { say(data.detail || 'Could not load the history.', false); return; }
      me = data.me || '';
      canManage = !!data.can_manage;
      audits = data.audits || [];
      document.getElementById('mineLabel').hidden = !me;
      if (!data.ready) {
        document.getElementById('bannerText').textContent =
          `${data.problem} Audits still work, they just are not saved. See DEPLOY.md, "Audit history".`;
        document.getElementById('banner').setAttribute('data-show', '');
      }
      const pick = document.getElementById('platform');
      const seen = new Map(audits.map((a) => [a.platform, a.platform_label || a.platform]));
      for (const [value, label] of seen) {
        if (!value) continue;
        const option = el('option', null, label);
        option.value = value;
        pick.appendChild(option);
      }
      render();
    } catch (e) {
      say('Could not reach the server. Try again.', false);
    }
  };

  for (const id of ['search', 'platform', 'mine']) document.getElementById(id).addEventListener('input', render);

  fetch('/auth/me', { cache: 'no-store' }).then((r) => r.json()).then((info) => {
    if (!info.signed_in) return;
    document.getElementById('accountEmail').textContent = info.email;
    document.getElementById('account').hidden = false;
  }).catch(() => {});
  load();
</script>
</body>
</html>
