<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefine App</title>
<meta name="description" content="Redefine Agency tools: website auditor and post auditor.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same tokens as the website auditor page, so the two read as one product. */
:root {
  --coral: #FC4452;
  --coral-dark: #d92f3c;
  --ink: #191616;
  --charcoal: #2C2828;
  --paper: #F4F3F0;
  --line: #D8D5CE;
  --muted: #7C7773;

  --font-display: 'Anton', 'Arial Narrow', sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;

  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 16px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; border-radius: 3px; }

main { width: 100%; max-width: 704px; text-align: center; }

.account { position: fixed; top: 16px; right: 20px; font-size: 13px; color: var(--muted); }
.account a { color: var(--ink); font-weight: 600; }
.logo { display: block; margin: 0 auto 18px; height: 64px; width: auto; }

.eyebrow {
  margin: 0 0 12px;
  font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted);
}

h1 {
  margin: 0 0 40px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(48px, 12vw, 112px);
  line-height: 1; letter-spacing: .005em; text-transform: uppercase;
  color: var(--ink);
}
h1 .accent { color: var(--coral); }

.tools {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  text-align: left;
}

.tool {
  display: flex; flex-direction: column; gap: 8px;
  padding: 24px 26px;
  border-radius: var(--radius);
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);
  text-decoration: none;
}
.tool h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 32px; line-height: 1.05; text-transform: uppercase;
}
.tool p { margin: 0 0 8px; color: var(--charcoal); }
.tool .cta {
  margin-top: auto;
  font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}

a.tool {
  background: var(--coral); border-color: var(--coral); color: #fff;
  transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
}
a.tool p { color: #fff; }
a.tool:hover { background: var(--coral-dark); border-color: var(--coral-dark); transform: translateY(-2px); }

/* The second tool keeps the outlined look from the mockup; hover fills it. */
a.tool.alt { background: #fff; border-color: var(--ink); color: var(--ink); }
a.tool.alt p { color: var(--charcoal); }
a.tool.alt:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
a.tool.alt:hover p { color: #fff; }

.more { margin: 22px 0 0; font-size: 13px; }
.more a { color: var(--ink); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
          border-bottom: 2px solid var(--coral); padding-bottom: 2px; }
.more a:hover { color: var(--coral-dark); }

@media (max-width: 640px) {
  .tools { grid-template-columns: 1fr; }
  h1 { margin-bottom: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  a.tool { transition: none; }
  a.tool:hover { transform: none; }
}
</style>
</head>
<body>
<div class="account" id="account" hidden><span id="accountEmail"></span><span class="sep"> · </span><a href="/auth/logout">Sign out</a></div>
<main>
  <img class="logo" src="/static/logo.svg" alt="Redefine" width="58" height="64">
  <p class="eyebrow">Redefine Agency · Tools</p>
  <h1><span class="accent">Re</span>define<span class="accent">.</span> App</h1>

  <div class="tools">
    <a class="tool" href="/website-audit">
      <h2>Website Auditor</h2>
      <p>Typography, colour, accessibility and performance, delivered as a PDF report.</p>
      <span class="cta">Open →</span>
    </a>

    <a class="tool alt" href="/post-audit">
      <h2>Post Auditor</h2>
      <p>Audit social media posts that are already live.</p>
      <span class="cta">Open →</span>
    </a>
  </div>
  <p class="more"><a href="/history">Audit history →</a></p>
</main>
<script>
  // Shows who is signed in, once sign-in is switched on; hidden otherwise.
  fetch('/auth/me', { cache: 'no-store' }).then((r) => r.json()).then((me) => {
    if (!me.signed_in) return;
    document.getElementById('accountEmail').textContent = me.email;
    const account = document.getElementById('account');
    if (me.can_manage_team) {
      // Owners and admins get a way into the team page.
      const link = document.createElement('a');
      link.href = '/admin/team';
      link.textContent = 'Team';
      const signOut = account.querySelector('a[href="/auth/logout"]');
      account.insertBefore(link, signOut);
      account.insertBefore(document.createTextNode(' · '), signOut);
    }
    account.hidden = false;
  }).catch(() => {});
</script>
</body>
</html>
